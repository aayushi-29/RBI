name: TAARR data foundation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Guard against committed secrets
        run: |
          set -eu
          # .env must never be tracked (real keys live only in the git-ignored .env).
          if git ls-files | grep -E '^\.env$|^\.env\.[^.]*$' | grep -v '^\.env\.example$'; then
            echo "A .env file is tracked in git history. Remove it and rotate any key it held." >&2
            exit 1
          fi
          # No live-looking Gemini key pattern anywhere in tracked files.
          if git grep -nE 'AIza[0-9A-Za-z_-]{30,}' -- . ':(exclude).github/workflows/ci.yml'; then
            echo "A string matching a Gemini API key pattern is committed. Remove it and rotate the key." >&2
            exit 1
          fi
          # .env.example must keep GEMINI_API_KEY empty, never a real-looking value.
          if grep -E '^GEMINI_API_KEY=.+' .env.example; then
            echo ".env.example must not set a real GEMINI_API_KEY value." >&2
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Validate gold benchmark ledger
        run: python -m taarr.dataset validate data/benchmark/benchmark.jsonl
      - name: Validate draft annotation queue
        run: python -m taarr.dataset validate data/benchmark/draft_items.jsonl
      - name: Audit source provenance and benchmark readiness
        run: python -m taarr.provenance_audit
      - name: Smoke-test experiment runner on empty gold benchmark
        env:
          TAARR_NO_VERSION_POLICY: NOT_APPLICABLE
          TAARR_MISSING_FACTS_POLICY: KLEENE
          TAARR_UNKNOWN_PRECEDENCE_POLICY: DEFINITIVE_RULES_FIRST
        run: python -m taarr.experiments --output /tmp/taarr-experiments-ci.json
      - name: Run tests
        run: pytest
      - name: Lint Python source and tests
        run: ruff check src tests

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Type-check and build frontend
        working-directory: frontend
        run: npm run build
